name: BTI Uptime & Supabase Keep-Alive

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) to keep Supabase active and monitor Render
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping-health:
    name: Check BTI Health & Postgres Connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping health endpoint and verify database
        run: |
          URL="https://beat-the-index.onrender.com/api/v1/health"
          echo "Pinging $URL..."

          # Render free tier takes ~30-50s on cold boot, so use 90s timeout with retries
          curl -s -S --max-time 90 --retry 3 --retry-delay 5 "$URL" | python3 -c '
          import sys, json

          raw = sys.stdin.read().strip()
          print("Response:", raw)

          data = json.loads(raw)
          storage = data.get("data", {}).get("storage", {})
          status = data.get("data", {}).get("status")

          assert status == "ok", f"Expected status ok, got {status}"
          assert storage.get("healthy") is True, f"Storage unhealthy: {storage}"
          print(f"SUCCESS: BTI API is up ({data[\"data\"].get(\"service\")}) and {storage.get(\"backend\")} is healthy.")
          '
